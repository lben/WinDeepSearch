name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        run: |
          # A release tag such as v0.2.0 sets the version; other builds use the one in Directory.Build.props.
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version }
          Write-Host "Version $version"
          Add-Content $env:GITHUB_ENV "WDS_VERSION=$version"

      - name: Engine tests
        run: dotnet test --project tests/WinDeepSearch.Core.Tests -c Release

      - name: Build the Windows 11 menu command
        run: |
          cmake -S src/WinDeepSearch.ShellExt -B build/shellext -A x64 "-DWDS_VERSION=$env:WDS_VERSION"
          cmake --build build/shellext --config Release
          $info = (Get-Item build/shellext/Release/WinDeepSearch.ShellExt.dll).VersionInfo
          Write-Host "Menu command DLL: $($info.ProductName) $($info.ProductVersion)"
          if ($info.ProductName -ne 'WinDeepSearch' -or $info.ProductVersion -ne $env:WDS_VERSION) { throw 'The DLL does not carry the product name and version.' }

      - name: Publish the app
        run: |
          dotnet publish src/WinDeepSearch -c Release -o artifacts/app "-p:Version=$env:WDS_VERSION"
          Copy-Item build/shellext/Release/WinDeepSearch.ShellExt.dll artifacts/app/
          Get-ChildItem -Recurse artifacts/app | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Build and sign the menu package
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./packaging/build-package.ps1 -AppDir artifacts/app

      - name: Build the installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:WDS_VERSION" packaging/WinDeepSearch.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Install
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Screen resolution unchanged: $_" }
          $p = Start-Process artifacts/WinDeepSearch-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup failed with $($p.ExitCode)" }
          Get-Content "$env:LOCALAPPDATA\WinDeepSearch\registration.log"
          $installed = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{ECF0B5BB-81DD-438B-94DD-2A0DDF6E92F8}_is1').DisplayVersion
          Write-Host "Installed $installed, app $((Get-Item "$env:LOCALAPPDATA\Programs\WinDeepSearch\WinDeepSearch.exe").VersionInfo.ProductVersion)"
          if ($installed -ne $env:WDS_VERSION) { throw "Installed version $installed, expected $env:WDS_VERSION." }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\WinDeepSearch\LICENSE.txt")) { throw 'LICENSE.txt is not installed.' }
          $package = Get-AppxPackage -Name WinDeepSearch
          if (-not $package) { throw 'The Windows 11 menu package is not registered.' }
          $package | Format-List Name, Version, InstallLocation, Status
          # The packaged entry also covers "Show more options"; a classic entry is only needed for drives.
          $drive = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\Drive\shell\WinDeepSearch\command').'(default)'
          if (-not $drive) { throw 'The classic menu entry for drives is missing.' }
          Write-Host "Drive -> $drive"
          foreach ($type in '*', 'Directory', 'Directory\Background') {
            if (Test-Path -LiteralPath "HKCU:\Software\Classes\$type\shell\WinDeepSearch") { throw "A duplicate classic entry exists for $type." }
          }

      - name: UI tests
        env:
          WDS_SCREENSHOTS: ${{ github.workspace }}\artifacts\screenshots
        run: dotnet test --project tests/WinDeepSearch.UiTests -c Release

      - name: Uninstall
        run: |
          $p = Start-Process "$env:LOCALAPPDATA\Programs\WinDeepSearch\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed with $($p.ExitCode)" }
          if (Get-AppxPackage -Name WinDeepSearch) { throw 'The menu package is still registered.' }
          foreach ($type in '*', 'Directory', 'Directory\Background', 'Drive') {
            if (Test-Path -LiteralPath "HKCU:\Software\Classes\$type\shell\WinDeepSearch") { throw "The classic menu entry for $type is still there." }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinDeepSearch
          path: |
            artifacts/WinDeepSearch-Setup.exe
            artifacts/screenshots

  # Runs only for a tag such as v0.2.0, and only after the installer passed every check above.
  release:
    needs: windows
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WinDeepSearch

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" WinDeepSearch-Setup.exe --repo "$GITHUB_REPOSITORY" --title "WinDeepSearch ${GITHUB_REF_NAME#v}" --generate-notes
