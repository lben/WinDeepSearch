name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Engine tests
        run: dotnet test --project tests/WinDeepSearch.Core.Tests -c Release

      - name: Build the Windows 11 menu command
        run: |
          cmake -S src/WinDeepSearch.ShellExt -B build/shellext -A x64
          cmake --build build/shellext --config Release

      - name: Publish the app
        run: |
          dotnet publish src/WinDeepSearch -c Release -o artifacts/app
          Copy-Item build/shellext/Release/WinDeepSearch.ShellExt.dll artifacts/app/
          Get-ChildItem -Recurse artifacts/app | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Build and sign the menu package
        run: ./packaging/build-package.ps1 -AppDir artifacts/app

      - name: Build the installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc packaging/WinDeepSearch.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Install
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Screen resolution unchanged: $_" }
          $p = Start-Process artifacts/WinDeepSearch-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup failed with $($p.ExitCode)" }
          Get-Content "$env:LOCALAPPDATA\WinDeepSearch\registration.log"
          $package = Get-AppxPackage -Name WinDeepSearch
          if (-not $package) { throw 'The Windows 11 menu package is not registered.' }
          $package | Format-List Name, Version, InstallLocation, Status
          foreach ($type in '*', 'Directory', 'Directory\Background', 'Drive') {
            $command = (Get-ItemProperty -LiteralPath "HKCU:\Software\Classes\$type\shell\WinDeepSearch\command").'(default)'
            if (-not $command) { throw "The classic menu entry for $type is missing." }
            Write-Host "$type -> $command"
          }

      - name: UI tests
        env:
          WDS_SCREENSHOTS: ${{ github.workspace }}\artifacts\screenshots
        run: dotnet test --project tests/WinDeepSearch.UiTests -c Release

      - name: Uninstall
        run: |
          $p = Start-Process "$env:LOCALAPPDATA\Programs\WinDeepSearch\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed with $($p.ExitCode)" }
          if (Get-AppxPackage -Name WinDeepSearch) { throw 'The menu package is still registered.' }
          if (Test-Path 'HKCU:\Software\Classes\Directory\shell\WinDeepSearch') { throw 'The classic menu entry is still there.' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinDeepSearch
          path: |
            artifacts/WinDeepSearch-Setup.exe
            artifacts/screenshots
